lang: es
title: "TobiXu — Familia de Distribuciones Rolling Release STEM+ARTS"
hero_glyph_alt: "Glifo TobiXu"
hero_title: "TobiXu"
tagline: "El río no se apresura, guardián: se encauza."
badge_rolling: "Rolling Release"
badge_trilingual: "🌐 Trilingüe"
main_heading: "GNU/Linux con cerebro STEM + oficio ARTS"
main_intro: "<strong>TobiXu (托比·许)</strong> es una familia de distribuciones GNU/Linux diseñada para <strong>científicos, ingenieros, artistas y creadores</strong>. Combina un cerebro STEM completo con un oficio ARTS profesional, todo envuelto en una identidad visual trilingüe que honra el español hablado en México, el chino mandarín y el inglés."
rolling_heading: "Rolling Release: siempre al día"
rolling_text_1: "TobiXu está basada en <strong>Debian sid</strong>, la rama <em>unstable</em> de Debian. Recibes las últimas versiones de todo el software sin esperar a un release mayor. Una vez instalada, tu sistema <strong>nunca queda obsoleto</strong>: una actualización continua te mantiene en la vanguardia."
rolling_advantages_label: "Ventajas:"
rolling_advantages: "software fresco, kernel reciente, drivers nuevos, librerías actualizadas."
rolling_consideration_label: "Consideración:"
rolling_consideration: "requiere usuarios dispuestos a convivir con la vanguardia y hacer mantenimiento ocasional."
variants_heading: "Variantes de escritorio"
