install_heading: "Instalación (variantes base)"
install_steps:
  - "Descarga la ISO desde Archive.org"
  - 'Grábala en USB con <code>dd</code> o <a href="https://www.balena.io/etcher/">Balena Etcher</a>'
  - "Arranca en modo UEFI (desactiva Secure Boot si es necesario)"
  - "Pruébala en modo live (sin instalar)"
  - 'Instala con Calamares (puerta <em>Instalar TobiXu</em> en el escritorio)'
  - 'Tras el primer arranque, instala la paquetería tobixu:<br><code>sudo apt update && sudo apt install tobixu-stem tobixu-arts</code>'
source_heading: "Código fuente"
source_text: 'Todo el código de TobiXu es libre y está en <a href="https://github.com/mlmateos/tobixu">GitHub</a>. Incluye scripts de build, metapaquetes, temas visuales y documentación completa.'
footer_tagline: "El río no se apresura, guardián: se encauza."
footer_architecture: "Arquitectura: tobixu.xyz (web) + Archive.org (ISO) + GitHub (código)"
features_note: "Los conjuntos de paquetes STEM y ARTS se ampliarán continuamente: cada horneada del río suma nuevas herramientas al cerebro y al oficio."
