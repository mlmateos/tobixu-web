features_heading: "包含什么？"
stem_heading: "STEM 大脑"
stem_items:
  - name: "texstudio"
    desc: "专业 LaTeX 编辑器"
  - name: "frescobaldi"
    desc: "LilyPond 乐谱编辑器"
  - name: "libreoffice"
    desc: "完整办公套件"
  - name: "qgis"
    desc: "地理信息系统"
  - name: "octave"
    desc: "数值计算（兼容 MATLAB）"
  - name: "gnugo, gnuchess"
    desc: "战略游戏"
  - name: "12 sgt-puzzles"
    desc: "逻辑谜题"
arts_heading: "ARTS 手艺"
arts_items:
  - name: "kdenlive"
    desc: "专业视频编辑"
  - name: "obs-studio"
    desc: "流媒体与录制"
  - name: "vlc"
    desc: "多媒体播放器"
  - name: "handbrake"
    desc: "视频转换"
  - name: "krita"
    desc: "数字绘画（Recommends）"
  - name: "ardour"
    desc: "数字音频工作站（Recommends）"
  - name: "musescore"
    desc: "音乐记谱（Recommends）"
