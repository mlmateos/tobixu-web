lang: zh
title: "TobiXu — STEM+ARTS 滚动发布发行版家族"
hero_glyph_alt: "TobiXu 字符"
hero_title: "TobiXu"
tagline: "河流不急躁，守护者：它找到自己的河道。"
badge_rolling: "滚动发布"
badge_trilingual: "🌐 三语"
main_heading: "拥有 STEM 大脑 + ARTS 手艺的 GNU/Linux"
main_intro: "<strong>TobiXu（托比·许）</strong>是为<strong>科学家、工程师、艺术家和创作者</strong>设计的 GNU/Linux 发行版家族。它将完整的 STEM 大脑与专业的 ARTS 手艺结合在一起，并以尊重墨西哥西班牙语、中文普通话和英语的三语视觉身份呈现。"
rolling_heading: "滚动发布：始终保持最新"
rolling_text_1: "TobiXu 基于 <strong>Debian sid</strong>，即 Debian 的 <em>unstable</em> 分支。您无需等待重大发布即可获得所有软件的最新版本。一旦安装，您的系统<strong>永远不会过时</strong>：持续更新让您始终走在前沿。"
rolling_advantages_label: "优势："
rolling_advantages: "最新软件、较新内核、新驱动、更新的库。"
rolling_consideration_label: "考量："
rolling_consideration: "需要愿意与前沿共存并偶尔进行维护的用户。"
