install_heading: "安装（基础变体）"
install_steps:
  - "从 Archive.org 下载 ISO"
  - '使用 <code>dd</code> 或 <a href="https://www.balena.io/etcher/">Balena Etcher</a> 刻录到 USB'
  - "以 UEFI 模式启动（如有必要，禁用 Secure Boot）"
  - "以 live 模式试用（不安装）"
  - '使用 Calamares 安装（桌面上的 <em>Instalar TobiXu</em> 门）'
  - '首次启动后，安装 TobiXu 软件包：<br><code>sudo apt update && sudo apt install tobixu-stem tobixu-arts</code>'
source_heading: "源代码"
source_text: '所有 TobiXu 代码都是自由的，位于 <a href="https://github.com/mlmateos/tobixu">GitHub</a>。包含构建脚本、元包、视觉主题和完整文档。'
footer_tagline: "河流不急躁，守护者：它找到自己的河道。"
footer_architecture: "架构：tobixu.xyz（网络）+ Archive.org（ISO）+ GitHub（代码）"
