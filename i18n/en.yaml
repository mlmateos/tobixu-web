install_heading: "Installation (base variants)"
install_steps:
  - "Download the ISO from Archive.org"
  - 'Burn it to USB with <code>dd</code> or <a href="https://www.balena.io/etcher/">Balena Etcher</a>'
  - "Boot in UEFI mode (disable Secure Boot if needed)"
  - "Try it in live mode (without installing)"
  - 'Install with Calamares (the <em>Install TobiXu</em> door on the desktop)'
  - 'After first boot, install the TobiXu packages:<br><code>sudo apt update && sudo apt install tobixu-stem tobixu-arts</code>'
source_heading: "Source code"
source_text: 'All TobiXu code is free and lives on <a href="https://github.com/mlmateos/tobixu">GitHub</a>. It includes build scripts, metapackages, visual themes and complete documentation.'
