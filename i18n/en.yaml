main_heading: "GNU/Linux with a STEM brain + ARTS craft"
main_intro: "<strong>TobiXu (托比·许)</strong> is a family of GNU/Linux distributions designed for <strong>scientists, engineers, artists and creators</strong>. It combines a complete STEM brain with a professional ARTS craft, wrapped in a trilingual visual identity that honors Mexican Spanish, Mandarin Chinese and English."
rolling_heading: "Rolling Release: always up to date"
rolling_text_1: "TobiXu is based on <strong>Debian sid</strong>, the <em>unstable</em> branch of Debian. You receive the latest versions of all software without waiting for a major release. Once installed, your system <strong>never becomes obsolete</strong>: continuous updates keep you at the cutting edge."
rolling_advantages_label: "Advantages:"
rolling_advantages: "fresh software, recent kernel, new drivers, updated libraries."
rolling_consideration_label: "Consideration:"
rolling_consideration: "requires users willing to live on the cutting edge and perform occasional maintenance."
